{% extends "base.html" %}
{% block title %}Mon profil — PronoGP{% endblock %}
{% block content %}
<h2>👤 Mon profil</h2>
<div class="card profile-v2">
  <div class="avatar-v2 avatar-lg"><img src="{{ url_for('player_avatar', participant_id=person.id) }}" alt="" onerror="this.style.display='none'"><span>{{ person.pseudo[:1]|upper }}</span></div>
  <h3>{{ person.pseudo }}</h3>
  <p>Cette photo suivra ton pseudo dans les classements et les saisons.</p>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="photo">Choisir une photo (JPG, PNG ou WebP ; jusqu'à 10 Mo)</label>
    <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
    <p><button class="btn" type="submit">📸 Enregistrer ma photo</button></p>
  </form>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="operation" value="delete">
    <button class="btn btn-small btn-warning" type="submit">Supprimer ma photo</button>
  </form>
</div>
{% endblock %}
