    <g transform="translate(508 280) rotate(-6)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="47" font-style="italic" font-weight="900" fill="#fff" stroke="#091629" stroke-width="2" paint-order="stroke">35</text></g>
    <!-- Sparks and headlights -->
    <path d="M675 297l17-7" stroke="#90f7ff" stroke-width="6" filter="url(#bright)"/>
    <path d="M366 293L292 303" stroke="#ff855a" stroke-width="4" opacity=".65"/>
