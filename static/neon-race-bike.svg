<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-label="Illustration originale d'une moto de compétition sur circuit">
<defs>
  <linearGradient id="night" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#031322"/><stop offset=".55" stop-color="#082943"/><stop offset="1" stop-color="#051525"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#991d28"/><stop offset=".4" stop-color="#f34932"/><stop offset="1" stop-color="#a0172c"/></linearGradient>
  <linearGradient id="fairing" x1="0" x2="1"><stop stop-color="#ef182e"/><stop offset=".46" stop-color="#f94a31"/><stop offset="1" stop-color="#d6132b"/></linearGradient>
  <linearGradient id="visor" x1="0" x2="1"><stop stop-color="#051b2e"/><stop offset=".5" stop-color="#30dcf5"/><stop offset="1" stop-color="#091727"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#24d7ff" stop-opacity=".28"/><stop offset="1" stop-color="#24d7ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="bright"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="940" height="500" fill="url(#night)"/>
<ellipse cx="685" cy="240" rx="310" ry="210" fill="url(#glow)"/>
<path d="M215 420C365 281 594 331 662 241S824 138 926 78" fill="none" stroke="#0e5979" stroke-width="95" opacity=".19"/>
<path d="M215 420C365 281 594 331 662 241S824 138 926 78" fill="none" stroke="#21e4ff" stroke-width="3" stroke-dasharray="8 18" opacity=".24"/>
<path d="M95 425C272 382 331 349 453 284" fill="none" stroke="#22caff" stroke-width="4" opacity=".65" filter="url(#bright)"/>
<path d="M144 459C308 401 438 395 536 324" fill="none" stroke="#1bb1ef" stroke-width="2" opacity=".45"/>
<g opacity=".30">
  <path d="M0 330L420 330M0 345L380 345M0 360L480 360" stroke="#48b8f5" stroke-width="2" stroke-dasharray="45 28"/>
  <path d="M0 475L900 475" stroke="#30caff" stroke-width="1"/>
</g>
<!-- Racing motorbike: original low-poly profile, viewed from the right -->
<g transform="translate(188 35) skewY(-3)">
