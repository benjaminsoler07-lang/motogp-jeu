    <path d="M403 246C487 220 550 221 610 244L660 269 690 307 635 336 535 351 444 319 370 294Z" fill="url(#fairing)" stroke="#fd9871" stroke-width="5"/>
    <path d="M454 268L535 243 609 255 647 282 563 310 461 301Z" fill="#ff6c48" opacity=".85"/>
    <path d="M436 308L522 332 599 315 638 327 557 350 469 334Z" fill="#091a29" opacity=".85"/>
